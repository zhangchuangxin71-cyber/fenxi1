openapi: 3.1.0
info:
  title: rag-knowledge-chat
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /v1/chat/completions:
    post:
      summary: Chat Completions
      operationId: chat_completions_v1_chat_completions_post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ChatCompletionRequest:
      properties:
        model:
          type: string
          maxLength: 128
          minLength: 1
          title: Model
          default: rag-knowledge-chat
        messages:
          items:
            $ref: '#/components/schemas/ChatMessage'
          type: array
          maxItems: 80
          minItems: 1
          title: Messages
        stream:
          type: boolean
          title: Stream
          default: true
        stream_options:
          $ref: '#/components/schemas/StreamOptions'
        temperature:
          type: number
          maximum: 2
          minimum: 0
          title: Temperature
          default: 0.2
        max_tokens:
          type: integer
          maximum: 8192
          minimum: 1
          title: Max Tokens
          default: 1200
        rag:
          $ref: '#/components/schemas/RagOptions'
      additionalProperties: false
      type: object
      required:
      - messages
      - rag
      title: ChatCompletionRequest
    ChatMessage:
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
          title: Role
        content:
          type: string
          maxLength: 32000
          minLength: 1
          title: Content
      additionalProperties: false
      type: object
      required:
      - role
      - content
      title: ChatMessage
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RagOptions:
      properties:
        user_id:
          type: string
          maxLength: 256
          minLength: 1
          title: User Id
        kb_id:
          type: string
          maxLength: 256
          minLength: 1
          title: Kb Id
        session_id:
          anyOf:
          - type: string
            maxLength: 256
            minLength: 1
          - type: 'null'
          title: Session Id
        doc_ids:
          items:
            type: string
            maxLength: 256
            minLength: 1
          type: array
          maxItems: 100
          title: Doc Ids
        temp_doc_ids:
          items:
            type: string
            maxLength: 256
            minLength: 1
          type: array
          maxItems: 100
          title: Temp Doc Ids
        top_k:
          anyOf:
          - type: integer
            maximum: 20
            minimum: 4
          - type: 'null'
          title: Top K
        max_return_tokens:
          anyOf:
          - type: integer
            maximum: 32768
            minimum: 4096
          - type: 'null'
          title: Max Return Tokens
        include_debug:
          type: boolean
          title: Include Debug
          default: false
      additionalProperties: false
      type: object
      required:
      - user_id
      - kb_id
      title: RagOptions
    StreamOptions:
      properties:
        include_usage:
          type: boolean
          title: Include Usage
          default: false
      additionalProperties: false
      type: object
      title: StreamOptions
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
