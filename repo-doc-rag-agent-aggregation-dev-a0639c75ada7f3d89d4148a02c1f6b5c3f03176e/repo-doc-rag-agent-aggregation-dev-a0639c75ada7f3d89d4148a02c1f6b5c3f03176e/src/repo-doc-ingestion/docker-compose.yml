services:
  postgres:
    image: postgres:16
    container_name: pageindex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pageindex}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${PGDATA_HOST_PATH:?set PGDATA_HOST_PATH to a data-disk directory in .env}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pageindex

  app:
    build:
      context: .
    image: repo-doc-ingestion:latest
    container_name: repo-doc-ingestion
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${APP_PORT:-8100}
      POSTGRES_DSN: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pageindex}"
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8100}:${APP_PORT:-8100}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pageindex

networks:
  pageindex:
    name: pageindex
