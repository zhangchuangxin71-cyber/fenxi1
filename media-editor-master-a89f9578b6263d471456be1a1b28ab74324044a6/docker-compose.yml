services:
  app:
    build:
      context: .
    image: videoaudiotext-api:latest
    container_name: videoaudiotext-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_PORT: ${API_PORT:-8787}
      PROJECT_ROOT: /app
      WORKSPACES_ROOT: /app/workspaces
      FONTS_DIR: /app/fonts
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      API_FETCH_ALLOW_PRIVATE: ${API_FETCH_ALLOW_PRIVATE:-0}
      MEDIA_UPLOAD_FETCH_TIMEOUT_SEC: ${MEDIA_UPLOAD_FETCH_TIMEOUT_SEC:-0}
      MEDIA_UPLOAD_MAX_RETRIES: ${MEDIA_UPLOAD_MAX_RETRIES:-3}
      # OSS 成片上传：ALIYUN_OSS_* / OSS_UPLOAD_ENABLED 由 env_file (.env) 注入，见 .env.example
      # 工作区 TTL 清扫（启动时 reconcile + purge；compose 成功且 OSS 上传后 workspace 会立即删除）
      WORKSPACE_TTL_EMPTY_DAYS: ${WORKSPACE_TTL_EMPTY_DAYS:-3}
      WORKSPACE_TTL_ABANDONED_DAYS: ${WORKSPACE_TTL_ABANDONED_DAYS:-7}
      WORKSPACE_TTL_COMPOSED_DAYS: ${WORKSPACE_TTL_COMPOSED_DAYS:-30}
      WORKSPACE_GRACE_HOURS: ${WORKSPACE_GRACE_HOURS:-24}
      # 并发（单机多 worker：共享 workspaces/_coord/ 文件锁；见 DOCKER_OPS.md）
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      GLOBAL_JOB_WORKERS: ${GLOBAL_JOB_WORKERS:-4}
      CLIP_BUILD_WORKERS: ${CLIP_BUILD_WORKERS:-4}
    ports:
      - "${API_PORT:-8787}:${API_PORT:-8787}"
    volumes:
      - ./workspaces:/app/workspaces
      - ./fonts:/app/fonts:ro
    mem_limit: ${API_MEM_LIMIT:-12g}
    # 停止容器时等待 compose 任务收尾，避免 deploy 时强杀导致 INTERRUPTED 任务
    stop_grace_period: 120s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.getenv(\"API_PORT\", \"8787\")}/api/v1/health', timeout=10).read()",
        ]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    # 回收 ffmpeg 子进程僵尸（长时间合成时更稳）
    init: true
