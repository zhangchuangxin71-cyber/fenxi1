[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videoaudiotext"
version = "1.0.0"
description = "文案成片 Flow B FastAPI：语义分句 → TTS → 素材绑定 → FFmpeg 合成"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jieba>=0.42.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "oss2>=2.18.0",
    "fonttools>=4.0",
]

[project.optional-dependencies]
asr = ["openai-whisper"]
dev = ["pytest>=7.0", "httpx>=0.27"]

[project.scripts]
videoaudiotext-api = "videoaudiotext.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
